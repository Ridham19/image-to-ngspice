<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSpice Studio - Professional</title>
    <meta name="description" content="WebSpice Studio — AI-powered circuit schematic editor with SPICE simulation">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>
    <input type="file" id="fileInput" accept="image/*" style="display: none;">

    <div class="toolbar">
        <div class="toolbar-group">
            <button id="btnLoadImage" class="btn-primary">Import AI</button>
            <span id="statusText" class="status-text">Ready.</span>
        </div>
        
        <div class="toolbar-group tools">
            <button id="tool-select" class="btn-tool active">Select</button>
            <button id="tool-wire" class="btn-tool">Wire</button>
            <span class="tool-separator"></span>
            <button id="tool-resistor" class="btn-tool">Resistor</button>
            <button id="tool-capacitor" class="btn-tool">Capacitor</button>
            <button id="tool-capacitor_polarized" class="btn-tool">Cap+</button>
            <button id="tool-inductor" class="btn-tool">Inductor</button>
            <button id="tool-diode" class="btn-tool">Diode</button>
            <button id="tool-diode_zener" class="btn-tool">Zener</button>
            <button id="tool-diode_led" class="btn-tool">LED</button>
            <span class="tool-separator"></span>
            <select id="tool-source-select" class="toolbar-select" style="width: auto; appearance: none; -moz-appearance: none; -webkit-appearance: none; padding-right: 15px; cursor: pointer;">
                <option value="" disabled selected>Sources ▼</option>
                <option value="source">DC Source</option>
                <option value="ac_source">AC Source</option>
                <option value="vss">VSS Supply</option>
                <option value="pulse_source">PULSE Source</option>
                <option value="sine_source">SINE Source</option>
                <option value="exp_source">EXP Source</option>
                <option value="pwl_source">PWL Source</option>
                <option value="sffm_source">SFFM Source</option>
                <option value="am_source">AM Source</option>
            </select>
            <span class="tool-separator"></span>
            <button id="tool-label" class="btn-tool" style="font-weight: 600;">LABEL</button>
            <button id="tool-ground" class="btn-tool">GND</button>
            <span class="tool-separator"></span>
            <button id="tool-bjt_npn" class="btn-tool">NPN</button>
            <button id="tool-bjt_pnp" class="btn-tool">PNP</button>
            <button id="tool-mosfet" class="btn-tool">FET</button>
            <button id="tool-opamp" class="btn-tool">Op-Amp</button>
            <button id="tool-transformer" class="btn-tool">XFMR</button>
            <button id="tool-ic" class="btn-tool">IC</button>
        </div>

        <div class="toolbar-group">
            <button id="btnSimSetup" class="btn-sim-setup" title="Simulation Setup">⚙️ Setup</button>
            <button id="btnSimulate" class="btn-success">▶ RUN</button>
        </div>
    </div>

    <div class="main-container">
        <div class="canvas-container" id="canvasWrapper">
            <div class="grid-background"></div>
            <canvas id="circuitCanvas"></canvas>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">PROPERTIES</div>
            <div id="propertiesPanel" class="sidebar-content">
                <p class="placeholder-text">Select a component</p>
            </div>

            <div class="sidebar-header netlist-header" id="netlistToggle">
                NETLIST <span class="toggle-icon">▼</span>
            </div>
            <div id="netlistPreview" class="sidebar-content netlist-panel">
                <pre id="netlistText" class="netlist-code">Click RUN to generate</pre>
            </div>

            <div class="sidebar-header">SIMULATION OUTPUT</div>
            <div id="simulationOutput" class="sidebar-content sim-output">
                <p class="placeholder-text">No simulation data</p>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════ -->
    <!-- SIMULATION SETUP MODAL                       -->
    <!-- Matches PySpice Studio SimulationDialog       -->
    <!-- ═══════════════════════════════════════════ -->
    <div id="simModal" class="modal-overlay" style="display:none;">
        <div class="modal-container">
            <div class="modal-header">
                <h2>Simulation Setup</h2>
                <button id="modalClose" class="modal-close-btn">&times;</button>
            </div>

            <!-- Tab Navigation -->
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="tab-analysis">Analysis Config</button>
                <button class="modal-tab" data-tab="tab-plot">Plot &amp; Colors</button>
            </div>

            <!-- Tab: Analysis Config -->
            <div id="tab-analysis" class="modal-tab-content active">
                <div class="modal-form-row">
                    <label class="modal-label">Simulation Mode</label>
                    <select id="simModeSelect" class="modal-select">
                        <option value="op">Operating Point</option>
                        <option value="tran">Transient</option>
                        <option value="dc">DC Sweep</option>
                        <option value="ac">AC Analysis</option>
                    </select>
                </div>
                <div id="simParamsContainer" class="modal-params-area">
                    <!-- Dynamic form fields rendered by JS -->
                </div>
            </div>

            <!-- Tab: Plot & Colors -->
            <div id="tab-plot" class="modal-tab-content">
                <div class="modal-section-title">Graph Appearance</div>
                <div class="modal-form-row">
                    <label class="modal-label">Background</label>
                    <select id="plotBgColor" class="modal-select modal-select-sm">
                        <option value="white" selected>white</option>
                        <option value="black">black</option>
                        <option value="#1E1E1E">#1E1E1E (dark)</option>
                    </select>
                </div>

                <div class="modal-section-title">Active Signals</div>
                <div id="signalList" class="signal-list">
                    <p class="placeholder-text" id="noSignalsMsg">No signals added yet</p>
                </div>

                <div class="modal-section-title">Add New Signal</div>
                <div class="modal-form-row-inline">
                    <label class="modal-label-sm">Color</label>
                    <select id="sigColorSelect" class="modal-select modal-select-sm">
                        <option value="red">red</option>
                        <option value="blue">blue</option>
                        <option value="green">green</option>
                        <option value="orange">orange</option>
                        <option value="magenta">magenta</option>
                        <option value="cyan">cyan</option>
                        <option value="yellow">yellow</option>
                        <option value="brown">brown</option>
                    </select>
                    <label class="modal-label-sm">Window</label>
                    <select id="sigWindowSelect" class="modal-select modal-select-sm">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                </div>

                <div class="modal-form-row">
                    <label class="modal-label">Voltage v(node)</label>
                    <select id="sigNodeSelect" class="modal-select">
                        <option value="">— solve nodes first —</option>
                    </select>
                    <button id="btnAddVoltage" class="modal-btn-add">+ Add</button>
                </div>
                <div class="modal-form-row">
                    <label class="modal-label">Current i(source)</label>
                    <select id="sigSourceSelect" class="modal-select">
                        <option value="">— solve nodes first —</option>
                    </select>
                    <button id="btnAddCurrent" class="modal-btn-add">+ Add</button>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button id="btnModalCancel" class="modal-btn-cancel">Cancel</button>
                <button id="btnModalRun" class="modal-btn-run">▶ Run Simulation</button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════ -->
    <!-- AI DETECTION PREVIEW MODAL                   -->
    <!-- ═══════════════════════════════════════════ -->
    <div id="aiDebugModal" class="modal-overlay" style="display:none;">
        <div class="modal-container" style="max-width: 90%; max-height: 90%;">
            <div class="modal-header">
                <h2>AI Detection Preview</h2>
                <button id="aiDebugModalClose" class="modal-close-btn">&times;</button>
            </div>
            
            <div class="modal-tab-content active" style="text-align: center; overflow: auto; max-height: 65vh; padding: 10px;">
                <img id="debugPreviewImage" src="" alt="AI Detection Debug Output" style="max-width: 100%; border: 1px solid #333; border-radius: 4px;">
            </div>

            <div class="modal-footer">
                <button id="btnAiDebugCancel" class="modal-btn-cancel">Cancel</button>
                <button id="btnAiDebugImport" class="modal-btn-run">Import to Canvas</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
